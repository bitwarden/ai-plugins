name: Atlassian MCP Server Testing

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "plugins/bitwarden-atlassian-tools/mcp/bitwarden-atlassian-mcp-server/**"
      - ".github/workflows/atlassian-mcp-server-test.yml"
      - ".nvmrc"
  push:
    branches:
      - main
    paths:
      - "plugins/bitwarden-atlassian-tools/mcp/bitwarden-atlassian-mcp-server/**"
      - ".github/workflows/atlassian-mcp-server-test.yml"
      - ".nvmrc"
  workflow_dispatch:

permissions: {}

defaults:
  run:
    working-directory: plugins/bitwarden-atlassian-tools/mcp/bitwarden-atlassian-mcp-server

jobs:
  testing:
    name: Run tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Get Node version
        id: retrieve-node-version
        working-directory: ${{ github.workspace }}
        run: |
          NODE_NVMRC=$(cat .nvmrc)
          NODE_VERSION=${NODE_NVMRC/v/''}
          echo "node_version=$NODE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ steps.retrieve-node-version.outputs.node_version }}

      - name: Set up pnpm via Corepack
        run: |
          corepack enable
          corepack prepare --activate

      - name: Get pnpm store directory
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('plugins/bitwarden-atlassian-tools/mcp/bitwarden-atlassian-mcp-server/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm run test
