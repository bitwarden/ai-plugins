name: Deploy

on:
  workflow_dispatch:

permissions: {}

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Deploy release
        run: ./scripts/deploy.sh

      - name: Notify Datadog of deploy
        run: ./scripts/notify-datadog.sh
