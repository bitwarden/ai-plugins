name: Deploy

on:
  workflow_dispatch:

permissions: {}

jobs:
  deploy:
    name: Deploy to CDN
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Purge cache and deploy
        run: ./deploy.sh
