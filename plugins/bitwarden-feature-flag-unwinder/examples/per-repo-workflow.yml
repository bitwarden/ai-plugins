# Per-repo feature-flag unwinder workflow.
#
# Copy into each target repo (bitwarden/clients, bitwarden/server,
# bitwarden/ios, bitwarden/android) at
# `.github/workflows/feature-flag-unwinder.yml` and set the REPO value
# in the `env:` block to match this repo's name. Leave the rest alone.
#
# Pattern matches bitwarden/clients `sdk-update.yml`: workflow lives in
# the target repo, checks out self, mints a GH App token from Azure KV,
# commits as bw-ghapp[bot], uses a reusable flag-cleanup branch guarded
# against human edits.

name: Feature flag unwinder

on:
  repository_dispatch:
    types:
      - feature-flag-unwinder
  workflow_dispatch:
    inputs:
      jira_issue_key:
        description: "Jira issue key (e.g. PM-45033)"
        required: true
        type: string

env:
  _REPO: "clients" # ← set to clients | server | ios | android for the copy in that repo
  _BOT_NAME: "bw-ghapp[bot]"
  _BOT_EMAIL: "178206702+bw-ghapp[bot]@users.noreply.github.com"

defaults:
  run:
    shell: bash

jobs:
  unwind:
    name: Unwind ${{ inputs.jira_issue_key || github.event.client_payload.jira_issue_key }}
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
    env:
      JIRA_ISSUE_KEY: ${{ inputs.jira_issue_key || github.event.client_payload.jira_issue_key }}
      REPO: ${{ env._REPO }}

    steps:
      - name: Log in to Azure
        uses: bitwarden/gh-actions/azure-login@main
        with:
          subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          tenant_id: ${{ secrets.AZURE_TENANT_ID }}
          client_id: ${{ secrets.AZURE_CLIENT_ID }}

      - name: Get Azure Key Vault secrets
        id: get-kv-secrets
        uses: bitwarden/gh-actions/get-keyvault-secrets@main
        with:
          keyvault: gh-org-bitwarden
          secrets: "BW-GHAPP-ID,BW-GHAPP-KEY,ANTHROPIC-API-KEY,JIRA-EMAIL,JIRA-API-TOKEN"

      - name: Log out from Azure
        uses: bitwarden/gh-actions/azure-logout@main

      - name: Generate GH App token
        uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859 # v3.0.0
        id: app-token
        with:
          app-id: ${{ steps.get-kv-secrets.outputs.BW-GHAPP-ID }}
          private-key: ${{ steps.get-kv-secrets.outputs.BW-GHAPP-KEY }}
          permission-pull-requests: write
          permission-contents: write
          permission-actions: read

      - name: Checkout target repo (self)
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
          persist-credentials: true

      - name: Checkout clients sidecar (Step 2 server runs only)
        if: ${{ env._REPO == 'server' }}
        uses: actions/checkout@v4
        with:
          repository: bitwarden/clients
          path: .clients-sidecar
          fetch-depth: 0 # need tag history for the compat gate

      - name: Configure git identity
        run: |
          git config user.name "$_BOT_NAME"
          git config user.email "$_BOT_EMAIL"

      - name: Install Claude Code + plugins
        run: |
          # TODO: install Claude Code CLI and the plugins the agent depends on.
          # Pattern (confirm against current Claude Code docs):
          #   npm install -g @anthropic-ai/claude-code
          #   claude /plugin marketplace add bitwarden/ai-plugins
          #   claude /plugin install bitwarden-feature-flag-unwinder@bitwarden-marketplace
          #   claude /plugin install bitwarden-atlassian-tools@bitwarden-marketplace
          #   claude /plugin install bitwarden-delivery-tools@bitwarden-marketplace
          echo "TODO: install Claude Code + plugins"
          exit 1

      - name: Run feature-flag-unwinder agent
        uses: anthropics/claude-code-base-action@v1 # confirm current action version
        with:
          anthropic_api_key: ${{ steps.get-kv-secrets.outputs.ANTHROPIC-API-KEY }}
          allowed_tools: Read,Edit,Write,Grep,Glob,Bash,Skill
          prompt: |
            Dispatch to the `feature-flag-unwinder` agent in the current
            repo (${{ env._REPO }}). Jira issue: `${{ env.JIRA_ISSUE_KEY }}`.
            Follow the agent's procedure exactly. If any step fails,
            comment the failure on the Jira ticket and stop.
        env:
          JIRA_ISSUE_KEY: ${{ env.JIRA_ISSUE_KEY }}
          REPO: ${{ env._REPO }}
          CLIENTS_REPO: ${{ env._REPO == 'server' && format('{0}/.clients-sidecar', github.workspace) || '' }}
          ATLASSIAN_EMAIL: ${{ steps.get-kv-secrets.outputs.JIRA-EMAIL }}
          ATLASSIAN_API_TOKEN: ${{ steps.get-kv-secrets.outputs.JIRA-API-TOKEN }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

# Required Azure KV secrets (keyvault `gh-org-bitwarden`):
#   BW-GHAPP-ID        — the Bitwarden GH App ID installed on this repo
#   BW-GHAPP-KEY       — the Bitwarden GH App's private key
#   ANTHROPIC-API-KEY  — Claude API key for the base action
#   JIRA-EMAIL         — Atlassian account email for the agent's Jira calls
#   JIRA-API-TOKEN     — Atlassian API token with read + comment permissions
#
# Required GH App installation permissions on this repo:
#   contents: write           — commit, push to the flag-cleanup branch
#   pull-requests: write      — open or edit the draft PR
#   actions: read             — read workflow run metadata
#
# Branch convention:
#   `flag-cleanup/<flag-key>-step-<N>` — reusable per flag/step, guarded
#   against human edits by the agent itself.
#
# Guards the agent runs before touching the branch:
#   - Branch exists on remote? Check its tip author.
#     If not bw-ghapp[bot], abort and link the existing PR on Jira.
#   - Open PR carries `stop-cleanup` label? Abort and link the PR on Jira.
#
# This workflow does not know the flag key or the step; the agent reads
# both from the Jira ticket. Dispatch payload only needs `jira_issue_key`.
