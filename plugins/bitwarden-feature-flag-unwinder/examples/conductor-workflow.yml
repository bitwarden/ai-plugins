# Conductor workflow — biweekly dispatcher for the feature-flag unwinder.
#
# Lives in a Bitwarden ops repo you control (not inside any target repo).
# Runs every other Wednesday at 15:00 UTC, queries Jira for actionable
# cleanup tasks, and sends `repository_dispatch: feature-flag-unwinder`
# events to each target repo:
#
#   Step 1 (`flagged-logic-removal`) → bitwarden/clients, server, ios, android
#   Step 2 (`server-flag-removal`)   → bitwarden/server
#
# The conductor itself does not clone target repos, open PRs, or touch
# code. Each target repo runs its own copy of `per-repo-workflow.yml`
# in response to the dispatch and the agent inside that workflow does
# the actual cleanup for just that one repo. All PRs the agent opens
# are posted back to the Jira ticket as separate per-repo comments.

name: Feature flag unwinder — conductor

on:
  schedule:
    - cron: "0 15 * * 3" # Wednesdays 15:00 UTC
  workflow_dispatch:
    inputs:
      jira_issue_key:
        description: "Dispatch a specific Jira issue (bypasses the ready-for-cleanup query)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  biweekly-gate:
    name: Biweekly gate (even ISO weeks only)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    outputs:
      proceed: ${{ steps.gate.outputs.proceed }}
    steps:
      - id: gate
        run: |
          WEEK=$(date -u +%V)
          if [ $((10#$WEEK % 2)) -eq 0 ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            echo "ISO week $WEEK is even — proceeding."
          else
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "ISO week $WEEK is odd — skipping this cycle."
          fi

  find-tasks:
    name: Query Jira for ready-for-cleanup tasks
    runs-on: ubuntu-latest
    needs: [biweekly-gate]
    permissions:
      id-token: write
    if: |
      always() &&
      (github.event_name == 'workflow_dispatch' ||
       needs.biweekly-gate.outputs.proceed == 'true')
    outputs:
      step1_keys: ${{ steps.search.outputs.step1_keys }}
      step2_keys: ${{ steps.search.outputs.step2_keys }}
    steps:
      - name: Log in to Azure
        uses: bitwarden/gh-actions/azure-login@main
        with:
          subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          tenant_id: ${{ secrets.AZURE_TENANT_ID }}
          client_id: ${{ secrets.AZURE_CLIENT_ID }}

      - name: Get Azure Key Vault secrets
        id: get-kv-secrets
        uses: bitwarden/gh-actions/get-keyvault-secrets@main
        with:
          keyvault: gh-org-bitwarden
          secrets: "JIRA-EMAIL,JIRA-API-TOKEN"

      - name: Log out from Azure
        uses: bitwarden/gh-actions/azure-logout@main

      - name: Query Jira
        id: search
        env:
          JIRA_EMAIL: ${{ steps.get-kv-secrets.outputs.JIRA-EMAIL }}
          JIRA_API_TOKEN: ${{ steps.get-kv-secrets.outputs.JIRA-API-TOKEN }}
          MANUAL_KEY: ${{ inputs.jira_issue_key }}
        run: |
          set -euo pipefail

          # Fetch (key, labels) for every candidate task so we can split
          # Step 1 vs. Step 2 without a second round-trip.
          if [ -n "${MANUAL_KEY:-}" ]; then
            JQL="key = \"$MANUAL_KEY\""
          else
            JQL='labels = "ready-for-cleanup" AND (labels = "flagged-logic-removal" OR labels = "server-flag-removal") AND statusCategory != Done'
          fi
          ENCODED=$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))' "$JQL")

          RESPONSE=$(curl -sSf -u "$JIRA_EMAIL:$JIRA_API_TOKEN" \
            -H "Accept: application/json" \
            "https://bitwarden.atlassian.net/rest/api/3/search?jql=${ENCODED}&fields=labels&maxResults=50")

          STEP1=$(echo "$RESPONSE" | jq -c '[.issues[] | select(.fields.labels | index("flagged-logic-removal")) | .key]')
          STEP2=$(echo "$RESPONSE" | jq -c '[.issues[] | select(.fields.labels | index("server-flag-removal")) | .key]')

          echo "Step 1 tasks: $STEP1"
          echo "Step 2 tasks: $STEP2"
          echo "step1_keys=$STEP1" >> "$GITHUB_OUTPUT"
          echo "step2_keys=$STEP2" >> "$GITHUB_OUTPUT"

  dispatch-step1:
    name: Step 1 — ${{ matrix.jira_issue_key }} → ${{ matrix.repo }}
    runs-on: ubuntu-latest
    needs: [find-tasks]
    if: needs.find-tasks.outputs.step1_keys != '[]' && needs.find-tasks.outputs.step1_keys != ''
    permissions:
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        repo: [clients, server, ios, android]
        jira_issue_key: ${{ fromJson(needs.find-tasks.outputs.step1_keys) }}
    steps:
      - name: Log in to Azure
        uses: bitwarden/gh-actions/azure-login@main
        with:
          subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          tenant_id: ${{ secrets.AZURE_TENANT_ID }}
          client_id: ${{ secrets.AZURE_CLIENT_ID }}

      - name: Get Azure Key Vault secrets
        id: get-kv-secrets
        uses: bitwarden/gh-actions/get-keyvault-secrets@main
        with:
          keyvault: gh-org-bitwarden
          secrets: "BW-GHAPP-ID,BW-GHAPP-KEY"

      - name: Log out from Azure
        uses: bitwarden/gh-actions/azure-logout@main

      - name: Generate GH App token (for dispatching to target repo)
        uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859 # v3.0.0
        id: app-token
        with:
          app-id: ${{ steps.get-kv-secrets.outputs.BW-GHAPP-ID }}
          private-key: ${{ steps.get-kv-secrets.outputs.BW-GHAPP-KEY }}
          owner: bitwarden
          repositories: ${{ matrix.repo }}
          permission-contents: write # for repository_dispatch

      - name: Dispatch to bitwarden/${{ matrix.repo }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh api -X POST "repos/bitwarden/${{ matrix.repo }}/dispatches" \
            -f event_type=feature-flag-unwinder \
            -F "client_payload[jira_issue_key]=${{ matrix.jira_issue_key }}"

  dispatch-step2:
    name: Step 2 — ${{ matrix.jira_issue_key }} → bitwarden/server
    runs-on: ubuntu-latest
    needs: [find-tasks]
    if: needs.find-tasks.outputs.step2_keys != '[]' && needs.find-tasks.outputs.step2_keys != ''
    permissions:
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        jira_issue_key: ${{ fromJson(needs.find-tasks.outputs.step2_keys) }}
    steps:
      - name: Log in to Azure
        uses: bitwarden/gh-actions/azure-login@main
        with:
          subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          tenant_id: ${{ secrets.AZURE_TENANT_ID }}
          client_id: ${{ secrets.AZURE_CLIENT_ID }}

      - name: Get Azure Key Vault secrets
        id: get-kv-secrets
        uses: bitwarden/gh-actions/get-keyvault-secrets@main
        with:
          keyvault: gh-org-bitwarden
          secrets: "BW-GHAPP-ID,BW-GHAPP-KEY"

      - name: Log out from Azure
        uses: bitwarden/gh-actions/azure-logout@main

      - name: Generate GH App token (for dispatching to server)
        uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859 # v3.0.0
        id: app-token
        with:
          app-id: ${{ steps.get-kv-secrets.outputs.BW-GHAPP-ID }}
          private-key: ${{ steps.get-kv-secrets.outputs.BW-GHAPP-KEY }}
          owner: bitwarden
          repositories: server
          permission-contents: write

      - name: Dispatch to bitwarden/server
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh api -X POST "repos/bitwarden/server/dispatches" \
            -f event_type=feature-flag-unwinder \
            -F "client_payload[jira_issue_key]=${{ matrix.jira_issue_key }}"

# Required Azure KV secrets (keyvault `gh-org-bitwarden`):
#   BW-GHAPP-ID / BW-GHAPP-KEY — GitHub App installed on clients, server, ios, android
#   JIRA-EMAIL / JIRA-API-TOKEN — Atlassian account for the JQL query
#
# The conductor only mints tokens for repository_dispatch — it never
# touches target-repo code. Each per-repo workflow mints its own GH App
# token for the actual commit/push/PR work.
#
# Jira label conventions on the Bitwarden side:
#   - `ready-for-cleanup`         — "this task is actionable now"
#   - `flagged-logic-removal`     — Step 1 (dispatches to all four repos)
#   - `server-flag-removal`       — Step 2 (dispatches to server only)
# Step 3 (archive in LaunchDarkly) is manual and intentionally un-labelled.
